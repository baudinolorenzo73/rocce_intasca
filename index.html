const esc = value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalized=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let path=[],uncertain=false,view='riconosci',search='',family='',photoOnly=false,compareA='granito',compareB='gneiss',db=null,dbError=false,records=[],installPrompt=null,currentPhoto='',editing=null,currentDialog=null,hasResume=false;
try{const saved=JSON.parse(localStorage.getItem('rit-session')||'null');if(saved?.version===1&&Array.isArray(saved.path)&&pathValid(saved.path)){path=saved.path;uncertain=Boolean(saved.uncertain);hasResume=path.length>0||uncertain;}if(localStorage.getItem('rit-theme')==='dark')document.body.classList.add('dark');}catch{}
function persist(){try{localStorage.setItem('rit-session',JSON.stringify({version:1,path,uncertain}));}catch{toast('Il browser non consente il salvataggio del percorso.');}}
let toastTimer;
function toast(message){$('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),5000);}
function rockArt(id='granito',label=false){
 const rock=byId[id]||byId.granito;const palettes={magmatica:['#c9b5a0','#8b7764','#b8a18d','#e1cdb6'],sedimentaria:['#c7c19d','#908969','#d9d3b5','#aea882'],metamorfica:['#adbdb4','#70877e','#cbd5ce','#93a89c']};const p=palettes[rock.family];
 const texture=rock.family==='metamorfica'?'<path d="M25 53L138 32M18 65L151 43M28 80L141 58M43 90L129 72" stroke="'+p[1]+'" stroke-width="5" opacity=".45"/>':rock.family==='sedimentaria'?'<path d="M20 53L145 48M23 68L149 65M38 82L138 79" stroke="'+p[1]+'" stroke-width="3" opacity=".5"/>':'<g fill="'+p[1]+'" opacity=".7"><path d="M42 48l8-6 6 8-10 5zM73 61l7-8 8 6-5 9zM111 48l6-7 8 7-8 9zM116 76l6-5 6 7-8 6zM55 78l4-7 8 3-3 8z"/></g><g fill="'+p[3]+'"><path d="M65 36l9-4 7 8-10 5zM94 78l7-6 7 9-8 5zM92 44l8-5 9 7-10 6z"/></g>';
 return `<svg viewBox="0 0 175 110" ${label?'role="img" aria-label="Disegno schematico di roccia"':'aria-hidden="true"'}><defs><clipPath id="c-${esc(id)}"><path d="M18 67L33 32L80 14L126 24L157 55L145 88L96 101L42 91Z"/></clipPath></defs><path d="M21 85L96 109L155 88L161 60L157 55L145 88L96 101L42 91Z" fill="${p[1]}" opacity=".3"/><path d="M18 67L33 32L80 14L126 24L157 55L145 88L96 101L42 91Z" fill="${p[0]}"/><path d="M18 67L67 59L80 14L33 32Z" fill="${p[3]}"/><path d="M67 59L126 24L157 55L145 88Z" fill="${p[2]}"/><path d="M18 67L42 91L96 101L67 59Z" fill="${p[1]}" opacity=".65"/><g clip-path="url(#c-${esc(id)})">${texture}</g><path d="M33 32L67 59L145 88M67 59L80 14" stroke="${p[1]}" opacity=".35" fill="none"/></svg>`;
}
function photoSrc(photo){return photo.file.startsWith('data:')?photo.file:`./photos/${photo.file}`;}
function rockMedia(r){
 const photo=photoMeta[r.id];
 if(!photo)return `<span class="rock-art">${rockArt(r.id)}</span>`;
 return `<span class="rock-art photo"><img src="${esc(photoSrc(photo))}" alt="Campione fotografico di ${esc(r.name)}" loading="lazy" decoding="async"><span class="photo-tag">FOTO CAMPIONE</span></span>`;
}
function externalLinks(r){
 const wiki=`https://it.wikipedia.org/wiki/Speciale:Ricerca?search=${encodeURIComponent(r.name)}`;
 const mindat=`https://www.mindat.org/search.php?search=${encodeURIComponent(externalTerms[r.id]||r.name)}`;
 return `<div class="external-links"><a class="btn" href="${wiki}" target="_blank" rel="noopener">W Wikipedia italiana ↗</a><a class="btn" href="${mindat}" target="_blank" rel="noopener">◆ Mindat: banca dati ↗</a></div><p class="external-note">I collegamenti aprono fonti esterne online. Mindat è la fonte specialistica; Wikipedia è più immediata ma va verificata.</p>`;
}
function intro(eyebrow,title,description,art=true){return `<div class="intro"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${description}</p></div>${art?`<div class="specimen">${rockArt('gneiss')}</div>`:''}</div>`;}
function pill(r){return `<span class="pill ${r.family}">${families[r.family]} · ${esc(r.type)}</span>`;}
function pathMarkup(){return path.length?`<ol class="path-list">${path.map((s,i)=>`<li><span>${i+1}. ${esc(nodes[s.node].title)}</span><b>${esc(nodes[s.node].options[s.choice].label)}</b></li>`).join('')}</ol>`:'<p class="empty-path">Le tue osservazioni compariranno qui, un passo alla volta.</p>';}
function aside(){return `<aside class="side-content"><div class="hint-card"><div class="eyebrow">PRIMA DI INIZIARE</div><h3 style="margin-top:12px">Guarda da vicino.</h3><ol><li>Osserva una superficie pulita, poco alterata.</li><li>Usa buona luce e una lente, se disponibile.</li><li>Scegli solo ciò che riesci a vedere. In caso di dubbio, confronta le alternative.</li></ol></div><div class="panel path-box"><div class="small-label">Il tuo percorso</div>${pathMarkup()}</div><p class="notice">La chiave comprende 31 voci tipiche. Un campione può appartenere a rocce non incluse.</p></aside>`;}
function details(r){const photo=photoMeta[r.id];return `${photo?`<figure class="result-photo"><img src="${esc(photoSrc(photo))}" alt="Campione fotografico di ${esc(r.name)}"><figcaption>Foto esemplificativa, non diagnostica. ${esc(photo.author)} · ${esc(photo.license)} — <a href="${esc(photo.url)}" target="_blank" rel="noopener">Wikimedia Commons: ${esc(photo.source)} ↗</a>${photo.note?`<br>${esc(photo.note)}`:''}</figcaption></figure>`:`<div class="result-art">${rockArt(r.id)}</div><p class="art-caption">Disegno schematico della famiglia: non è una foto diagnostica.</p>`}<p>${esc(r.description)}</p><div class="result-section"><h3>Cosa osservare</h3><p>${esc(r.observe)}</p></div><div class="result-section"><h3>Cosa verificare</h3><p>${esc(r.caution)}</p></div>${externalLinks(r)}`;}
function wizard(){
 const id=pathValid(path)||'start';
 let content;
 if(uncertain){const ids=descendants(id);content=`<div class="step-top"><span>Campione da approfondire</span><span>${ids.length} alternative</span></div><h2>Non forziamo la scelta.</h2><p class="help">Queste sono le voci raggiungibili da questo punto della chiave, non una graduatoria di probabilità. Il campione potrebbe anche non essere incluso.</p><div class="candidate-list">${ids.map(r=>`<button class="btn" data-action="detail" data-id="${r}">${esc(byId[r].name)} ↗</button>`).join('')}</div><div class="question-actions"><button class="btn text" data-action="leave-uncertain">← Torna all’osservazione</button><button class="btn" data-action="save-uncertain">Salva come indeterminato</button></div>`;}
 else if(byId[id]){const r=byId[id];content=`<div class="step-top"><span>Ipotesi dal percorso</span><span>Da verificare</span></div>${pill(r)}<h2 class="result-name">${esc(r.name)}</h2>${details(r)}<div class="notice" style="margin-top:21px">È una proposta didattica basata sulle risposte, senza una percentuale di certezza.</div><div class="result-actions"><button class="btn primary" data-action="save-result" data-id="${r.id}">＋ Salva nel taccuino</button><button class="btn" data-action="back">← Rivedi ultima scelta</button><button class="btn text" data-action="reset">Nuovo campione</button></div>`;}
 else{const node=nodes[id];content=`<div class="step-top"><span>Osservazione ${path.length+1}</span><div class="step-dots" aria-hidden="true">${Array.from({length:Math.min(path.length+1,8)},()=>'<i class="done"></i>').join('')}<i></i><i></i></div></div><h2>${esc(node.title)}</h2><p class="help">${esc(node.help)}</p><div class="answers">${node.options.map((opt,i)=>`<button class="answer" data-action="answer" data-choice="${i}"><span class="letter" aria-hidden="true">${String.fromCharCode(65+i)}</span><span class="answer-copy"><strong>${esc(opt.label)}</strong>${opt.hint?`<small>${esc(opt.hint)}</small>`:''}</span><span class="arrow" aria-hidden="true">›</span></button>`).join('')}</div><div class="question-actions"><button class="btn text" data-action="back" ${path.length?'':'disabled'}>← Indietro</button><button class="btn" data-action="uncertain">Non so / nessuna corrisponde</button></div>`;}
 return intro('DALL’OSSERVAZIONE ALL’IPOTESI','Ogni roccia ha<br>una storia.','Segui gli indizi del tuo campione. Una domanda alla volta, dal primo sguardo a una possibile identità.')+(hasResume?'<div class="resume"><span>Hai ripreso il percorso salvato su questo dispositivo.</span><button class="btn" data-action="reset">Ricomincia</button></div>':'')+`<div class="layout"><section class="panel question-panel" aria-label="Riconoscimento guidato">${content}</section>${aside()}</div>`;
}
function card(r){return `<button class="rock-card" data-action="detail" data-id="${r.id}">${rockMedia(r)}<span class="copy"><span class="pill ${r.family}">${families[r.family]}</span><h3>${esc(r.name)}</h3><p>${esc(r.type)}</p><span class="card-bottom">${photoMeta[r.id]?'FOTO E SCHEDA':'ESPLORA LA SCHEDA'} <span aria-hidden="true">↗</span></span></span></button>`;}
function rockOptions(selected){return rocks.map(r=>`<option value="${r.id}" ${selected===r.id?'selected':''}>${esc(r.name)}</option>`).join('');}
function compareRocks(){
 const a=byId[compareA],b=byId[compareB];
 if(!a||!b)return;
 const cell=(title,key)=>`<div class="compare-label">${title}</div><div>${esc(a[key])}</div><div>${esc(b[key])}</div>`;
 openModal('Confronto tra rocce',`<div class="compare-grid"><div></div><div class="compare-head">${rockMedia(a)}<h3>${esc(a.name)}</h3>${pill(a)}</div><div class="compare-head">${rockMedia(b)}<h3>${esc(b.name)}</h3>${pill(b)}</div>${cell('Tipo','type')}${cell('Descrizione','description')}${cell('Cosa osservare','observe')}${cell('Possibili confusioni','caution')}</div><p class="notice" style="margin-top:18px">Il confronto evidenzia differenze utili, ma non sostituisce l’osservazione del campione e del contesto geologico.</p>`);
}
function atlas(){const photoCount=Object.keys(photoMeta).length;return intro('31 VOCI DA CONFRONTARE','Un piccolo atlante.<br>Molti indizi.','Cerca un nome o una caratteristica. Confronta le schede prima di dare un nome al campione.')+`<div class="toolbar"><input type="search" id="rock-search" placeholder="Cerca: granito, pori, quarzo…" aria-label="Cerca nell’atlante" value="${esc(search)}"><select id="family-filter" aria-label="Filtra per famiglia"><option value="">Tutte le famiglie</option>${Object.entries(families).map(([k,v])=>`<option value="${k}" ${family===k?'selected':''}>${v}</option>`).join('')}</select><label class="photo-filter"><input type="checkbox" id="photo-filter" ${photoOnly?'checked':''}> Con foto (${photoCount})</label></div><div class="compare-bar"><span><b>Confronta due rocce</b><small>Metti fianco a fianco struttura e caratteri.</small></span><select id="compare-a" aria-label="Prima roccia">${rockOptions(compareA)}</select><span class="versus">VS</span><select id="compare-b" aria-label="Seconda roccia">${rockOptions(compareB)}</select><button class="btn primary" data-action="compare">Confronta</button></div><p class="count" id="rock-count" aria-live="polite"></p><div class="rock-grid" id="rock-grid"></div><p class="notice" style="margin-top:24px">Le fotografie mostrano un singolo campione: colore e aspetto possono variare. Le altre schede usano disegni schematici. Le 31 voci comprendono anche varietà e termini tradizionali.</p>`;}
function filterAtlas(){const terms=normalized(search).trim().split(/\s+/);const filtered=rocks.filter(r=>(!family||r.family===family)&&(!photoOnly||photoMeta[r.id])&&terms.every(t=>normalized([r.name,r.description,r.observe,r.type,r.caution].join(' ')).includes(t)));$('#rock-grid').innerHTML=filtered.map(card).join('')||'<p class="muted">Nessuna scheda corrisponde. Prova un termine più semplice o disattiva il filtro foto.</p>';$('#rock-count').textContent=`${filtered.length} voci su ${rocks.length}${photoOnly?' · con fotografia':''}`;}
function notebook(){
 const cards=records.map(record=>`<article class="panel record">${record.photo?`<img src="${esc(record.photo)}" alt="Foto del campione ${esc(record.title)}">`:''}<div class="body"><small>${esc(record.date)} ${record.place?'· '+esc(record.place):''}</small><h3>${esc(record.title)}</h3><span class="pill">${record.rockId?esc(byId[record.rockId].name):'Indeterminato'} · Ipotesi</span>${record.notes?`<p>${esc(record.notes)}</p>`:''}${record.lat&&record.lon?`<a class="gps-link" href="https://www.openstreetmap.org/?mlat=${encodeURIComponent(record.lat)}&mlon=${encodeURIComponent(record.lon)}#map=16/${encodeURIComponent(record.lat)}/${encodeURIComponent(record.lon)}" target="_blank" rel="noopener">⌖ Apri posizione sulla mappa ↗</a>`:''}${record.path.length?`<small>${record.path.length} osservazioni salvate</small>`:''}</div><div class="actions"><button class="btn" data-action="edit-note" data-id="${esc(record.id)}">Modifica</button><button class="btn" data-action="delete-note" data-id="${esc(record.id)}">Elimina</button></div></article>`).join('');
 return intro('LE TUE OSSERVAZIONI','Un campione.<br>Un ricordo da conservare.','Annota luogo, coordinate, foto e indizi. Il taccuino resta nel browser di questo dispositivo: esportalo per conservarne una copia.')+`<div class="toolbar"><button class="btn primary" data-action="new-note">＋ Nuova osservazione</button><button class="btn" data-action="export" ${records.length?'':'disabled'}>↓ Esporta taccuino</button><button class="btn" data-action="import">↑ Importa</button><input type="file" id="import-file" accept="application/json,.json" hidden></div>${dbError?'<p class="notice">Il browser non rende disponibile il taccuino locale. Il riconoscimento e l’atlante restano utilizzabili. Prova ad aprire l’app online in Chrome.</p>':''}${records.length?cards:'<section class="panel empty"><div class="eyebrow">TACCUINO DI CAMPO</div><h2 style="margin-top:15px">La prossima scoperta<br>inizia da un’osservazione.</h2><p>Salva un’ipotesi dal riconoscimento oppure aggiungi direttamente un campione ancora da identificare.</p><button class="btn" data-view="riconosci">Inizia il riconoscimento →</button></section>'}`;
}
function guide(){return intro('COME USARE LA CHIAVE','Prima il campione.<br>Poi il nome.','Uno strumento per imparare a osservare, pensato per lo studio e le uscite sul terreno.')+`<div class="guide-grid"><section class="panel"><h2>Come funziona</h2><p>1. Osserva il campione e scegli la struttura più evidente.</p><p>2. Rispondi solo quando riconosci il carattere indicato. Puoi tornare indietro.</p><p>3. Usa “Non so” per confrontare le schede ancora raggiungibili, o salva un campione indeterminato.</p><p>4. Confronta l’ipotesi con più caratteri e con il contesto geologico.</p><p>Tutte le 31 fotografie dell’atlante mostrano esempi reali, ma non eseguono riconoscimento automatico e non sostituiscono il confronto dei caratteri.</p></section><section class="panel"><h2>Tre famiglie</h2><p><b>Magmatiche.</b> Si formano dalla solidificazione di magma o lava. Le intrusive raffreddano in profondità; le vulcaniche in superficie o vicino ad essa.</p><p><b>Sedimentarie.</b> Derivano da deposizione e consolidamento di frammenti, da accumuli biologici o da precipitazione chimica.</p><p><b>Metamorfiche.</b> Derivano dalla trasformazione di rocce preesistenti per nuove condizioni di pressione e temperatura, senza fusione completa.</p></section><section class="panel"><h2>Parole da campo</h2><dl class="glossary"><dt>Cristallo</dt><dd>Porzione di minerale con struttura ordinata; le facce esterne non sono sempre visibili.</dd><dt>Clasto</dt><dd>Frammento di una roccia o di un minerale inglobato nel campione.</dd><dt>Matrice</dt><dd>Materiale più fine che circonda cristalli o frammenti più grandi.</dd><dt>Foliazione / scistosità</dt><dd>Struttura planare legata all’orientamento dei minerali; può facilitare la separazione in lamine.</dd><dt>Vescicola</dt><dd>Cavità lasciata dai gas in un materiale vulcanico.</dd><dt>Frattura concoide</dt><dd>Rottura con superfici curve, simili a una conchiglia.</dd><dt>Fenocristallo</dt><dd>Cristallo più grande del fondo della roccia vulcanica.</dd></dl></section><section class="panel"><h2>I limiti utili da ricordare</h2><ul><li>Le rocce alterate possono avere colori e superfici ingannevoli.</li><li>Il colore è un indizio, non una diagnosi.</li><li>Calcare, dolomia e marmo richiedono attenzione: l’effervescenza non identifica la famiglia.</li><li>Le diverse rocce intrusive e vulcaniche non si separano sempre a occhio nudo.</li><li>Ardesia, quarzite, serpentinite e molte altre rocce non sono incluse.</li><li>La chiave non richiede prove con acido, né di rompere il campione.</li></ul><p>Usa preferibilmente campioni didattici o già disponibili; documenta senza danneggiare affioramenti.</p></section><section class="panel sources wide"><h2>Fonti e adattamento</h2><p>Riferimento iniziale: <a href="${SOURCE}" target="_blank" rel="noopener">G.M.P.E. — Chiavi di riconoscimento delle rocce ↗</a>. Le 31 voci sono riprese come ambito didattico; il percorso, i testi delle schede e i disegni sono rielaborati per questa app. Non è l’app ufficiale del G.M.P.E. e non riproduce le fotografie del sito.</p><p>Quadro generale: <a href="https://www.bgs.ac.uk/discovering-geology/rocks-and-minerals/" target="_blank" rel="noopener">British Geological Survey — Rocks and minerals ↗</a>. Composizione e tessitura magmatica: <a href="https://www.nps.gov/subjects/geology/igneous.htm" target="_blank" rel="noopener">National Park Service — Igneous Rocks ↗</a>. Fotografie dei campioni: fonti istituzionali e autori Wikimedia Commons; autore e licenza sono indicati in ogni scheda. Consultazione delle fonti: 13 ottobre 2026.</p><p>Le precisazioni evitano alcune semplificazioni: un marmo può essere colorato; una dolomia non è necessariamente organogena; una breccia può avere diverse origini; porfido è un termine tessiturale e tradizionale.</p></section>${guideExtras()}${geaReview()}<section class="panel wide"><h2>App e dati</h2><p>Versione ${VERSION}. Atlante e riconoscimento sono contenuti nell’app. Il taccuino e le foto sono salvati localmente nel browser, senza caricamento a un servizio di riconoscimento. I backup esportati possono includere foto, luoghi e coordinate annotate.</p><p>L’eliminazione dei dati del browser può cancellare il taccuino: usa regolarmente l’esportazione. La versione HTML scaricabile contiene tutto il riconoscimento e l’atlante.</p><div class="result-actions"><button class="btn" data-action="install">↓ Installa / scarica</button><button class="btn" data-action="theme">◐ Cambia tema</button><button class="btn" data-action="update">↻ Controlla aggiornamenti</button></div><p id="offline-guide" class="muted"></p></section></div>`;}
function guideExtras(){return `<section class="panel wide test-lab"><div class="eyebrow">BANCO PROVE</div><h2 style="margin-top:10px">Registra gli indizi del campione</h2><p>Queste osservazioni restringono il campo, senza produrre un’identificazione automatica.</p><div class="test-grid"><label>Grani visibili<select id="test-grains"><option value="unknown">Non so</option><option value="yes">Sì</option><option value="no">No</option></select></label><label>Bande o foliazione<select id="test-foliation"><option value="unknown">Non so</option><option value="yes">Sì</option><option value="no">No</option></select></label><label>Porosità evidente<select id="test-pores"><option value="unknown">Non so</option><option value="yes">Sì</option><option value="no">No</option></select></label><label>Scalfisce il vetro<select id="test-glass"><option value="unknown">Non provato</option><option value="yes">Sì</option><option value="no">No</option></select></label><label>Attrazione magnetica<select id="test-magnet"><option value="unknown">Non provata</option><option value="yes">Sì</option><option value="no">No</option></select></label><label>Effervescenza già osservata<select id="test-fizz"><option value="unknown">Non provata</option><option value="yes">Sì</option><option value="no">No</option></select></label></div><button class="btn primary" data-action="interpret-tests">Interpreta gli indizi</button><div id="test-result" class="test-result" aria-live="polite"></div><p class="notice">Non assaggiare o leccare i campioni. L’app non richiede acidi; registra l’effervescenza solo se la prova è stata svolta in modo sicuro e competente.</p></section><section class="panel wide"><div class="eyebrow">GEOLOGIA LOCALE</div><h2 style="margin-top:10px">Rocce e geositi del Piemonte</h2><p>Per capire una roccia è spesso decisivo sapere dove è stata raccolta. Consulta la cartografia ufficiale e confronta il punto GPS del taccuino con le unità geologiche circostanti.</p><div class="result-actions"><a class="btn primary" href="https://www.arpa.piemonte.it/scheda-informativa/cartografia-geologica" target="_blank" rel="noopener">GeoPiemonte e cartografia ARPA ↗</a><a class="btn" href="https://www.arpa.piemonte.it/scheda-informativa/patrimonio-geologico-divulgazione-delle-geoscienze" target="_blank" rel="noopener">Geositi e itinerari piemontesi ↗</a><a class="btn" href="https://portalesgi.isprambiente.it/" target="_blank" rel="noopener">Servizio Geologico d’Italia ↗</a></div><p class="help" style="margin-top:14px">Le carte mostrano unità geologiche e affioramenti, non identificano automaticamente un ciottolo trasportato o materiale di riporto.</p></section>`;}
function interpretTests(){
 const value=id=>$('#'+id)?.value||'unknown',hints=[];
 if(value('test-foliation')==='yes')hints.push('Bande o foliazione orientano verso una roccia metamorfica: confronta gneiss, micascisto e fillade.');
 if(value('test-grains')==='yes'&&value('test-foliation')!=='yes')hints.push('Grani visibili senza orientamento possono indicare una magmatica intrusiva oppure una sedimentaria clastica. Distingui cristalli incastrati da frammenti cementati.');
 if(value('test-grains')==='no'&&value('test-pores')==='yes')hints.push('Grana non visibile e pori suggeriscono di confrontare pomice, basalto vescicolare e travertino.');
 if(value('test-fizz')==='yes')hints.push('L’effervescenza indica carbonati: confronta calcare, marmo, dolomia e marna. Non distingue da sola la famiglia della roccia.');
 if(value('test-glass')==='yes')hints.push('La capacità di scalfire il vetro è compatibile con materiali ricchi in silice, come selce e molte rocce quarzose.');
 if(value('test-magnet')==='yes')hints.push('Una risposta magnetica può indicare magnetite o altri minerali ferromagnetici; è un indizio mineralogico, non il nome della roccia.');
 if(!hints.length)hints.push('Servono altri caratteri osservabili. Prova struttura, forma dei grani, peso apparente e contesto geologico, poi usa la chiave guidata.');
 $('#test-result').innerHTML=`<h3>Indicazioni</h3><ul>${hints.map(h=>`<li>${h}</li>`).join('')}</ul><button class="btn" data-view="riconosci">Apri il riconoscimento guidato →</button>`;
}
function render(focus=false){
 document.querySelectorAll('[data-view]').forEach(el=>el.classList.toggle('active',el.dataset.view===view||(view==='avigliana'&&el.dataset.view==='piemonte')));$('#section-name').textContent=({riconosci:'Riconoscimento',atlante:'Atlante',taccuino:'Taccuino',guida:'Guida e fonti',piemonte:'Piemonte',avigliana:'Avigliana e Lago Piccolo'})[view];
 $('#main').innerHTML=({riconosci:wizard,atlante:atlas,taccuino:notebook,guida:guide,piemonte,avigliana})[view]();if(view==='atlante')filterAtlas();if(view==='piemonte')filterRegional();if(view==='guida')$('#offline-guide').textContent=offlineMessage();$('#theme span').textContent=document.body.classList.contains('dark')?'Tema chiaro':'Tema scuro';if(focus){$('#main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'auto'});}
}
function openModal(title,content,actions=''){currentDialog=document.activeElement;$('#modal').classList.remove('map-dialog');$('#modal-content').innerHTML=`<div class="modal-header"><h2>${title}</h2><button class="close" data-action="close" aria-label="Chiudi">×</button></div>${content}${actions?`<div class="modal-footer">${actions}</div>`:''}`;if(!$('#modal').open)$('#modal').showModal();}
function closeModal(){$('#modal').close();if(currentDialog?.isConnected)currentDialog.focus();}
function openDetail(id){const r=byId[id];if(!r)return;openModal(esc(r.name),pill(r)+details(r),`<button class="btn primary" data-action="save-card" data-id="${r.id}">＋ Annota questa ipotesi</button>`);}
function askReset(){openModal('Un nuovo campione?',`<p>Il percorso di riconoscimento attuale verrà azzerato. Le osservazioni già salvate nel taccuino rimangono disponibili.</p>`,`<button class="btn" data-action="close">Annulla</button><button class="btn primary" data-action="reset-confirm">Ricomincia</button>`);}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function noteEditor(rockId='',record=null,includePath=false){
 if(!db){toast(dbError?'Taccuino non disponibile in questo browser.':'Il taccuino si sta aprendo. Riprova tra un momento.');return;}
 editing=record?{...record}:null;
 currentPhoto=record?.photo||'';
 const value=record||{title:byId[rockId]?.name||'Campione indeterminato',rockId,date:today(),place:'',lat:'',lon:'',notes:'',path:includePath?[...path]:[]};
 openModal(record?'Modifica osservazione':'Nuova osservazione',`<form id="note-form"><div class="note-fields">
 <label>Nome del campione<input name="title" type="text" maxlength="120" required value="${esc(value.title)}"></label>
 <label>Ipotesi di riconoscimento<select name="rockId"><option value="">Indeterminato</option>${rocks.map(r=>`<option value="${r.id}" ${value.rockId===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select></label>
 <label>Data<input name="date" type="date" required value="${esc(value.date)}"></label>
 <label>Luogo<input name="place" type="text" maxlength="250" placeholder="Es. sentiero, valle, località…" value="${esc(value.place)}"></label>
 <div class="gps-fields"><label>Latitudine<input name="lat" id="note-lat" type="text" inputmode="decimal" placeholder="45.000000" value="${esc(value.lat||'')}"></label><label>Longitudine<input name="lon" id="note-lon" type="text" inputmode="decimal" placeholder="7.000000" value="${esc(value.lon||'')}"></label><button type="button" class="btn" data-action="locate">⌖ Usa posizione</button></div>
 <p id="gps-status" class="help" style="margin:0">Coordinate facoltative; restano nel taccuino locale.</p>
 <label>Note<textarea name="notes" maxlength="5000" placeholder="Struttura, colori, dubbi, contesto…">${esc(value.notes)}</textarea></label>
 <label>Foto del campione (facoltativa)<input type="file" id="photo-file" accept="image/*"></label>
 <div id="photo-area">${currentPhoto?`<img class="photo-preview" src="${esc(currentPhoto)}" alt="Foto del campione"><button type="button" class="btn text" data-action="remove-photo">Rimuovi foto</button>`:''}</div>
 <p class="help" style="margin:0">La foto viene ridotta e conservata sul dispositivo. Non viene analizzata automaticamente.</p>
 ${value.path.length?`<details><summary>Vedi le ${value.path.length} osservazioni del percorso</summary><ol class="path-list">${value.path.map(s=>`<li>${esc(nodes[s.node].title)}<b>${esc(nodes[s.node].options[s.choice].label)}</b></li>`).join('')}</ol></details>`:''}
 <div id="form-error" class="inline-error" role="alert"></div><div class="modal-footer"><button type="button" class="btn" data-action="close">Annulla</button><button class="btn primary" type="submit" id="save-note">Salva osservazione</button></div></div></form>`);
 $('#note-form').dataset.path=JSON.stringify(value.path);
}
async function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('rocce-in-tasca',1);req.onupgradeneeded=()=>req.result.createObjectStore('records',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(new Error('Taccuino bloccato da un’altra scheda.'));});}
async function readRecords(){return new Promise((resolve,reject)=>{const req=db.transaction('records','readonly').objectStore('records').getAll();req.onsuccess=()=>resolve(req.result.sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)));req.onerror=()=>reject(req.error);});}
async function writeRecords(items){return new Promise((resolve,reject)=>{const tx=db.transaction('records','readwrite');for(const item of items)tx.objectStore('records').put(item);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('Salvataggio interrotto'));});}
async function saveNote(form){
 const button=$('#save-note');button.disabled=true;
 try{
  const data=new FormData(form);
  const record={id:editing?.id||crypto.randomUUID?.()||`note-${Date.now()}-${Math.random().toString(36).slice(2)}`,title:String(data.get('title')).trim(),rockId:String(data.get('rockId')),date:String(data.get('date')),place:String(data.get('place')).trim(),lat:String(data.get('lat')||'').trim(),lon:String(data.get('lon')||'').trim(),notes:String(data.get('notes')).trim(),photo:currentPhoto,path:JSON.parse(form.dataset.path),updatedAt:new Date().toISOString()};
  if(!record.title)throw new Error('Inserisci un nome per il campione.');
  if((record.lat||record.lon)&&(!Number.isFinite(Number(record.lat))||!Number.isFinite(Number(record.lon))||Math.abs(Number(record.lat))>90||Math.abs(Number(record.lon))>180))throw new Error('Coordinate GPS non valide.');
  await writeRecords([record]);records=await readRecords();closeModal();view='taccuino';location.hash='taccuino';render(true);toast('Osservazione salvata nel taccuino.');
 }catch(error){$('#form-error').textContent=error.name==='QuotaExceededError'?'Spazio locale insufficiente. Esporta il taccuino, poi libera spazio o rimuovi la foto.':error.message||'Impossibile salvare. Il taccuino non è stato modificato.';button.disabled=false;}
}
async function photoFrom(file){if(!file?.type.startsWith('image/'))throw new Error('Scegli un file immagine.');if(file.size>20*1024*1024)throw new Error('Scegli una foto inferiore a 20 MB.');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const scale=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.round(img.naturalWidth*scale);canvas.height=Math.round(img.naturalHeight*scale);const context=canvas.getContext('2d');context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(img,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.82);}finally{URL.revokeObjectURL(url);}}
function download(name,body,type){const url=URL.createObjectURL(new Blob([body],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function validCoordinate(value,max){return value===undefined||value===''||(typeof value==='string'&&Number.isFinite(Number(value))&&Math.abs(Number(value))<=max);}
function validRecord(r){return r&&typeof r.id==='string'&&r.id.length<=100&&typeof r.title==='string'&&r.title.trim().length>0&&r.title.length<=120&&typeof r.rockId==='string'&&(!r.rockId||!!byId[r.rockId])&&typeof r.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&typeof r.place==='string'&&r.place.length<=250&&validCoordinate(r.lat,90)&&validCoordinate(r.lon,180)&&typeof r.notes==='string'&&r.notes.length<=5000&&typeof r.photo==='string'&&r.photo.length<3e6&&(!r.photo||/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(r.photo))&&Array.isArray(r.path)&&r.path.length<40&&Boolean(pathValid(r.path))&&typeof r.updatedAt==='string'&&Number.isFinite(Date.parse(r.updatedAt));}
async function importNotes(file){if(!db){toast('Il taccuino non è disponibile.');return;}if(file.size>25*1024*1024)throw new Error('Il backup supera 25 MB.');const data=JSON.parse(await file.text());if(data.app!=='rocce-in-tasca'||data.schema!==1||!Array.isArray(data.records)||data.records.length>500||!data.records.every(validRecord))throw new Error('Backup non valido: usa un’esportazione di Rocce in tasca.');const clean=data.records.map(r=>({id:r.id,title:r.title,rockId:r.rockId,date:r.date,place:r.place,lat:r.lat||'',lon:r.lon||'',notes:r.notes,photo:r.photo,path:r.path.map(s=>({node:s.node,choice:s.choice})),updatedAt:r.updatedAt}));openModal('Importa taccuino',`<p>Il backup contiene ${clean.length} osservazioni. Saranno aggiunte al taccuino; quelle con lo stesso identificativo saranno sostituite.</p>`,`<button class="btn" data-action="close">Annulla</button><button class="btn primary" id="confirm-import">Importa ${clean.length} osservazioni</button>`);$('#confirm-import').onclick=async()=>{const b=$('#confirm-import');b.disabled=true;try{await writeRecords(clean);records=await readRecords();closeModal();render();toast('Taccuino importato.');}catch{b.disabled=false;toast('Importazione non riuscita: verifica lo spazio disponibile.');}};}
let registration=null;
function offlineMessage(){if(location.protocol==='file:')return 'Stai usando la versione HTML: riconoscimento e atlante funzionano senza rete. Il taccuino dipende dal supporto del browser ai dati locali.';if(!navigator.onLine)return navigator.serviceWorker?.controller?'Sei offline. Questa copia dell’app è disponibile dalla cache locale.':'Sei offline. La disponibilità dopo la chiusura non è ancora verificata.';return navigator.serviceWorker?.controller?'Copia offline pronta su questo browser. Apri prima l’app online su ogni nuovo dispositivo.':'La copia offline non è ancora attiva. Puoi scaricare la versione HTML completa.';}
function networkStatus(){$('#network').textContent=!navigator.onLine?'Modalità offline':navigator.serviceWorker?.controller?'Copia offline pronta':'Connessione disponibile';if($('#offline-guide'))$('#offline-guide').textContent=offlineMessage();}
function installDialog(){openModal('Porta la guida con te',`<p>${esc(offlineMessage())}</p>${installPrompt?'<button class="btn primary" data-action="native-install">Installa sul dispositivo</button>':'<p class="help">Se disponibile, apri il menu del browser e scegli “Installa app” o “Aggiungi alla schermata Home”. Su iPhone e iPad usa Safari → Condividi → Aggiungi alla schermata Home.</p>'}<p>Puoi anche scaricare un unico file HTML con tutte le domande, le 31 schede e le fotografie, da aprire senza connessione.</p><a class="btn primary" href="./Rocce_in_tasca_v1.5.html" download>↓ Scarica versione HTML</a><p class="help" style="margin-top:18px">Il download dell’app non include il taccuino personale. Usa “Esporta taccuino” per salvarlo separatamente.</p>`);}
async function checkUpdate(){if(location.protocol==='file:'){toast('Per aggiornare la copia HTML, scarica la versione nuova dall’app online.');return;}if(!navigator.onLine){toast('Serve una connessione per controllare gli aggiornamenti.');return;}try{const response=await fetch('./version.json',{cache:'no-store'});if(!response.ok)throw new Error();const data=await response.json();await registration?.update();if(data.version===VERSION){toast(`Versione ${VERSION}: nessun aggiornamento disponibile.`);return;}openModal('Aggiornamento disponibile',`<p>Versione ${esc(data.version)} disponibile. Le osservazioni salvate nel taccuino verranno conservate.</p>`,`<button class="btn" data-action="close">Più tardi</button><button class="btn primary" data-action="apply-update">Aggiorna ora</button>`);}catch{toast('Controllo non riuscito. Riprova quando la connessione è disponibile.');}}
function toggleTheme(){document.body.classList.toggle('dark');try{localStorage.setItem('rit-theme',document.body.classList.contains('dark')?'dark':'light');}catch{}$('#theme span').textContent=document.body.classList.contains('dark')?'Tema chiaro':'Tema scuro';}
function locateNote(){
 const status=$('#gps-status');
 if(!navigator.geolocation){status.textContent='Geolocalizzazione non disponibile in questo browser.';return;}
 status.textContent='Ricerca della posizione…';
 navigator.geolocation.getCurrentPosition(position=>{const lat=$('#note-lat'),lon=$('#note-lon');if(!lat||!lon)return;lat.value=position.coords.latitude.toFixed(6);lon.value=position.coords.longitude.toFixed(6);status.textContent=`Posizione acquisita (precisione circa ${Math.round(position.coords.accuracy)} m).`;},error=>{status.textContent=error.code===1?'Permesso posizione negato. Puoi inserire le coordinate manualmente.':'Posizione non disponibile. Riprova all’aperto.';},{enableHighAccuracy:true,timeout:15000,maximumAge:30000});
}
document.addEventListener('click',async e=>{
 const button=e.target.closest('[data-action],[data-view]');if(!button||button.disabled)return;
 if(button.dataset.view){view=button.dataset.view;location.hash=view;render(true);return;}
 const action=button.dataset.action,id=button.dataset.id;
 try{
 if(action==='answer'){const node=pathValid(path)||'start';const choice=Number(button.dataset.choice);if(!nodes[node]?.options[choice])return;path.push({node,choice});uncertain=false;hasResume=false;persist();render(true);}
 else if(action==='back'){if(path.length)path.pop();uncertain=false;hasResume=false;persist();render(true);}
 else if(action==='uncertain'){uncertain=true;hasResume=false;persist();render(true);}
 else if(action==='leave-uncertain'){uncertain=false;persist();render(true);}
 else if(action==='detail')openDetail(id);
 else if(action==='compare')compareRocks();
 else if(action==='regional-site'){if(![lakeSite,...regionalSites].some(s=>s.id===id))return;selectedRegional=id;view='piemonte';location.hash='piemonte';render();$('.regional-selected')?.scrollIntoView?.({block:'start'});}
 else if(action==='regional-online')loadRegionalOnline();
 else if(action==='geologic-zoom')zoomGeologic(id);
 else if(action==='interpret-tests')interpretTests();
 else if(action==='reset')askReset();
 else if(action==='reset-confirm'){path=[];uncertain=false;hasResume=false;persist();closeModal();render(true);}
 else if(action==='close')closeModal();
 else if(action==='save-result')noteEditor(id,null,true);
 else if(action==='save-card')noteEditor(id,null,false);
 else if(action==='save-uncertain')noteEditor('',null,true);
 else if(action==='new-note')noteEditor();
 else if(action==='locate')locateNote();
 else if(action==='edit-note')noteEditor('',records.find(r=>r.id===id));
 else if(action==='remove-photo'){currentPhoto='';$('#photo-area').innerHTML='';$('#photo-file').value='';}
 else if(action==='delete-note'){const record=records.find(r=>r.id===id);openModal('Elimina osservazione',`<p>Eliminare “${esc(record.title)}” e la sua foto dal taccuino?</p>`,`<button class="btn" data-action="close">Annulla</button><button class="btn primary" data-action="delete-confirm" data-id="${esc(id)}">Elimina</button>`);}
 else if(action==='delete-confirm'){await new Promise((resolve,reject)=>{const tx=db.transaction('records','readwrite');tx.objectStore('records').delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});records=await readRecords();closeModal();render();toast('Osservazione eliminata.');}
 else if(action==='export')download(`Taccuino_rocce_${today()}.json`,JSON.stringify({app:'rocce-in-tasca',schema:1,exportedAt:new Date().toISOString(),records},null,2),'application/json');
 else if(action==='import')$('#import-file').click();
 else if(action==='install')installDialog();
 else if(action==='theme')toggleTheme();
 else if(action==='update')await checkUpdate();
 else if(action==='native-install'){await installPrompt?.prompt();installPrompt=null;closeModal();}
 else if(action==='apply-update'){if(registration?.waiting){registration.waiting.postMessage('SKIP_WAITING');navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload(),{once:true});}else location.reload();}
 }catch(error){toast(error.message||'Operazione non riuscita. Riprova.');}
});
document.addEventListener('submit',e=>{if(e.target.id==='note-form'){e.preventDefault();saveNote(e.target);}});
document.addEventListener('input',e=>{if(e.target.id==='rock-search'){search=e.target.value;filterAtlas();}if(e.target.id==='regional-search'){regionalSearch=e.target.value;filterRegional();}});
document.addEventListener('change',e=>{if(e.target.id==='regional-province'){regionalProvince=e.target.value;filterRegional();}});
document.addEventListener('input',e=>{if(e.target.id==='geologic-legend-search')filterGeologicLegend(e.target.value);if(e.target.id==='geologic-zoom-range')$('#geologic-zoom-image').style.width=(Number($('#geologic-zoom-image').dataset.baseWidth)*Number(e.target.value)/100)+'px';});
document.addEventListener('error',e=>{if(e.target.tagName==='IMG'&&e.target.closest('.geo-preview'))e.target.style.display='none';},true);
document.addEventListener('change',async e=>{try{if(e.target.id==='family-filter'){family=e.target.value;filterAtlas();}if(e.target.id==='photo-filter'){photoOnly=e.target.checked;filterAtlas();}if(e.target.id==='compare-a')compareA=e.target.value;if(e.target.id==='compare-b')compareB=e.target.value;if(e.target.id==='photo-file'&&e.target.files[0]){const file=e.target.files[0];$('#save-note').disabled=true;try{currentPhoto=await photoFrom(file);$('#photo-area').innerHTML=`<img class="photo-preview" src="${currentPhoto}" alt="Anteprima del campione"><button type="button" class="btn text" data-action="remove-photo">Rimuovi foto</button>`;}finally{if($('#save-note'))$('#save-note').disabled=false;}}if(e.target.id==='import-file'&&e.target.files[0]){await importNotes(e.target.files[0]);e.target.value='';}}catch(error){toast(error.message||'File non leggibile.');}});
$('#theme').onclick=toggleTheme;$('#install').onclick=installDialog;$('#update').onclick=checkUpdate;document.querySelectorAll('[data-version-label]').forEach(el=>el.textContent=VERSION);
window.addEventListener('hashchange',()=>{const target=location.hash.slice(1);if(['riconosci','atlante','taccuino','guida','piemonte','avigliana'].includes(target)&&target!==view){view=target;render(true);}});
window.addEventListener('online',networkStatus);window.addEventListener('offline',networkStatus);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;});
if(['riconosci','atlante','taccuino','guida','piemonte','avigliana'].includes(location.hash.slice(1)))view=location.hash.slice(1);
render();networkStatus();
openDB().then(async value=>{db=value;records=await readRecords();if(view==='taccuino')render();}).catch(()=>{dbError=true;if(view==='taccuino')render();});
if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').then(r=>{registration=r;networkStatus();navigator.serviceWorker.addEventListener('controllerchange',networkStatus);}).catch(()=>networkStatus());}
</script></body></html>
