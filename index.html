// Schede originali: nomi di partenza GMPE, criteri macroscopici riorganizzati.
const entries = [
 ['granito','Granito','magmatica','Intrusiva','Cristalli incastrati tra loro; quarzo, feldspati e miche.','Cerca quarzo traslucido e feldspati chiari. I minerali non formano bande regolari.','Granodiorite e gneiss: la sola tonalità chiara non basta.'],
 ['granito-rosa','Granito rosa','magmatica','Varietà di granito','Granito con feldspati rosati, quarzo e minerali scuri.','Osserva il rosa nei singoli cristalli, insieme al quarzo.','È una varietà cromatica del granito, non una famiglia distinta.'],
 ['granodiorite','Granodiorite','magmatica','Intrusiva','Quarzo e feldspati, con plagioclasio prevalente sul feldspato alcalino.','Aspetto granulare, minerali chiari e scuri; quarzo presente.','Separarla dal granito richiede di riconoscere e stimare i feldspati.'],
 ['tonalite','Tonalite','magmatica','Intrusiva','Quarzo, abbondante plagioclasio e minerali scuri; poco feldspato alcalino.','Cerca cristalli chiari, quarzo e anfiboli o miche scure.','La dimensione dei cristalli neri non distingue da sola una tonalite.'],
 ['sienite','Sienite','magmatica','Intrusiva','Roccia granulare ricca di feldspato alcalino, con quarzo scarso o assente.','Controlla la prevalenza dei feldspati e la scarsità di quarzo.','Un colore violaceo non è un carattere diagnostico. Può confondersi con granito.'],
 ['diorite','Diorite','magmatica','Intrusiva','Plagioclasio chiaro e minerali scuri, comunemente anfiboli.','Aspetto spesso puntinato bianco e nero, con poco quarzo.','Il rapporto bianco/nero orienta, ma la distinzione dal gabbro dipende dai minerali.'],
 ['gabbro','Gabbro / norite','magmatica','Intrusiva','Plagioclasio e pirosseni; aspetto granulare generalmente scuro.','Osserva cristalli scuri associati a feldspati chiari.','La norite contiene prevalentemente ortopirosseno: non si identifica dal nero.'],
 ['eufotide','Gabbro eufotide','magmatica','Denominazione tradizionale','Varietà tradizionale di gabbro con plagioclasio spesso alterato e pirosseno.','Può mostrare cristalli verdastri entro una massa chiara.','È una denominazione storica; il verde, da solo, non conferma il gabbro.'],
 ['riolite','Riolite','magmatica','Vulcanica','Roccia vulcanica ricca in silice, a fondo fine, talvolta con cristalli visibili.','Cerca una matrice fine chiara e possibili cristalli di quarzo o feldspato.','Colore e pochi cristalli non consentono una classificazione definitiva.'],
 ['porfido','Porfido','magmatica','Termine tessiturale / d’uso','Cristalli relativamente grandi entro una matrice più fine.','Riconosci due dimensioni di grana: fenocristalli e fondo.','Porfirico descrive una tessitura. Nel comune uso italiano il porfido è spesso riolitico.'],
 ['trachite','Trachite','magmatica','Vulcanica','Roccia vulcanica ricca di feldspati alcalini, generalmente povera di quarzo.','Piccoli feldspati possono formare una disposizione orientata nel fondo.','Il grigio non basta per distinguerla da andesite o altre vulcaniti.'],
 ['andesite','Andesite','magmatica','Vulcanica','Roccia vulcanica di composizione intermedia, spesso con plagioclasi.','Matrice fine con possibili cristalli chiari e minerali scuri.','Un campione può essere grigio o alterato: servono altri dati oltre al colore.'],
 ['basalto','Basalto','magmatica','Vulcanica','Roccia vulcanica mafica, spesso scura e a grana molto fine.','Aspetto compatto o vescicolare; può contenere olivina o pirosseni.','Esistono basalti con cavità e cristalli visibili; non sono sempre omogenei.'],
 ['ossidiana','Ossidiana','magmatica','Vetro vulcanico','Vetro vulcanico con lucentezza vitrea e frequente frattura concoide.','Osserva superfici simili al vetro e bordi curvi di frattura.','Può avere colori diversi dal nero. La selce può apparire simile.'],
 ['pomice','Pomice','magmatica','Vulcanica vescicolare','Materiale vulcanico con numerose vescicole e bassa densità apparente.','Cerca molte cavità ravvicinate; il campione è insolitamente leggero.','Il galleggiamento non è obbligatorio: dipende da porosità e saturazione d’acqua.'],
 ['breccia','Breccia','sedimentaria','Clastica, nel percorso proposto','Frammenti grossolani prevalentemente angolosi, cementati.','Osserva spigoli netti nei clasti, non solo nella frattura esterna.','Breccia descrive una tessitura: esistono anche brecce tettoniche e vulcaniche.'],
 ['puddinga','Puddinga / conglomerato','sedimentaria','Clastica','Ciottoli prevalentemente arrotondati all’interno di una matrice o cemento.','Cerca clasti maggiori di 2 mm con contorni smussati.','L’arrotondamento si valuta sui ciottoli inclusi, non sull’intero campione.'],
 ['arenaria','Arenaria','sedimentaria','Clastica','Granuli di dimensione sabbiosa, circa 0,063–2 mm, cementati.','Una lente aiuta a distinguere i granelli e la matrice.','La quarzite può assomigliarle, ma i granuli sono ricristallizzati e saldati.'],
 ['argillite','Argillite','sedimentaria','Clastica fine','Roccia consolidata ricca di particelle argillose, non distinguibili a occhio nudo.','Osserva grana finissima e possibile laminazione.','L’argillite non coincide con l’argilla sciolta: non deve necessariamente impastarsi.'],
 ['marna','Marna','sedimentaria','Mista carbonatica e argillosa','Roccia composta da una miscela di carbonato e frazione argillosa.','Spesso fine e terrosa; il contenuto carbonatico va verificato.','L’odore di fango è un indizio debole, non una prova di marna.'],
 ['calcare','Calcare','sedimentaria','Carbonatica','Roccia costituita soprattutto da calcite; origine biologica, chimica o detritica.','Cerca struttura carbonatica; fossili e stratificazione possono essere presenti.','L’effervescenza indica carbonati, non dimostra un’origine sedimentaria: anche il marmo reagisce.'],
 ['calcare-fossilifero','Calcare fossilifero','sedimentaria','Carbonatica con fossili','Calcare con resti o impronte riconoscibili di organismi.','Cerca forme di conchiglie o altri resti biologici nel campione.','Non ogni inclusione chiara è un fossile. Può essere un cristallo o un frammento.'],
 ['dolomia','Dolomia','sedimentaria','Carbonatica','Roccia costituita principalmente dal minerale dolomite.','Può essere compatta o cristallina, chiara o grigia.','Il colore non separa calcare e dolomia. La risposta all’acido dipende dalle condizioni del test.'],
 ['travertino','Travertino','sedimentaria','Precipitazione carbonatica','Deposito carbonatico da acque, spesso con bande, pori e impronte vegetali.','Osserva cavità e livelli di deposizione, generalmente chiari.','Porosità e colore da soli non escludono altri calcari porosi.'],
 ['selce','Selce','sedimentaria','Silicea','Roccia silicea molto fine e dura, spesso in noduli o livelli.','Lucentezza talvolta cerosa, frattura concoide; spesso associata a calcari.','Può avere diverse origini. Non è necessariamente organogena e il colore varia.'],
 ['litantrace','Litantrace','sedimentaria','Carbone fossile','Carbone nero, con aspetto opaco o bande lucide, derivato da materia organica.','Può lasciare una traccia nera ed essere più leggero di molte rocce comuni.','Non è sempre opaco: la sola lucentezza non lo separa dall’antracite.'],
 ['antracite','Antracite','sedimentaria','Carbone di alto rango','Carbone ad alto grado di evoluzione, compatto e spesso molto lucente.','Osserva lucentezza marcata e frattura spesso irregolare o concoide.','Il rango del carbone richiede dati oltre all’aspetto; può aver subito metamorfismo.'],
 ['marmo','Marmo saccaroide','metamorfica','Carbonatica ricristallizzata','Calcite o dolomite ricristallizzata, con aspetto granulare simile allo zucchero.','Cerca un mosaico di cristalli; la roccia può essere bianca, colorata o venata.','Il marmo può derivare da metamorfismo regionale o di contatto, non solo termico.'],
 ['gneiss','Gneiss','metamorfica','Foliata','Roccia con bande composizionali e minerali orientati.','Osserva alternanze chiare e scure; talvolta contiene grandi cristalli a forma di occhio.','La presenza di “occhi” non è obbligatoria. Le bande non sono semplice stratificazione sedimentaria.'],
 ['micascisto','Micascisto','metamorfica','Scistosa','Roccia foliata ricca di miche visibili, spesso lucente.','Lamelle brillanti e piani di scistosità; possono esserci granati.','I cristalli rossi non sono obbligatori. Contano tessitura e minerali.'],
 ['fillade','Fillade','metamorfica','Foliata fine','Roccia a grana fine con foliazione e lucentezza spesso sericea.','Superfici ondulate; le miche sono generalmente troppo fini per distinguerle bene.','Può confondersi con ardesia o micascisto fine, assenti o semplificati in questa chiave.']
];

function descendants(id,seen=new Set()) {
 if(byId[id]) return [id];
 if(!nodes[id] || seen.has(id)) return [];
 const next=new Set(seen);next.add(id);
 return [...new Set(nodes[id].options.flatMap(option=>descendants(option.to,next)))];
}
function pathValid(path) {
 let current='start';
 for(const step of path){if(step.node!==current||!nodes[current]?.options[step.choice])return false;current=nodes[current].options[step.choice].to;}
 return current;
}

const geaQuestions=[
 {q:'Che cos’è la diorite?',short:'È una roccia magmatica intrusiva di composizione intermedia, con cristalli visibili di plagioclasio e minerali scuri, spesso anfiboli.',more:'Cristallizza da un magma che raffredda lentamente in profondità. Può contenere biotite e pirosseni; il quarzo è generalmente scarso o assente nella diorite propriamente detta. L’aspetto bianco e nero è frequente, ma non basta a distinguerla dal gabbro: contano i minerali e la composizione dei plagioclasi.',avoid:'Non definirla sedimentaria né identificarla solo dal colore. Non confondere diorite con diorite orbiculare, che descrive una particolare tessitura.',rock:'diorite',source:'https://webapps.bgs.ac.uk/bgsrcs/rcs_details.cfm?code=DI'},
 {q:'Che cos’è l’anatessi?',short:'È la fusione di rocce preesistenti, generalmente parziale e in profondità, che produce un fuso magmatico e un residuo solido.',more:'A temperature sufficientemente alte i componenti della roccia non fondono tutti insieme. La fusione parziale può produrre magmi ricchi in silice e contribuire alla formazione di migmatiti, con porzioni di origine metamorfica e porzioni derivanti dal fuso. La presenza di fluidi e la composizione della roccia influenzano le condizioni di fusione.',avoid:'Il metamorfismo è una trasformazione prevalentemente allo stato solido; l’anatessi implica fusione. Non è un sinonimo di metamorfismo né il nome di una roccia.',source:'https://www.treccani.it/enciclopedia/anatessi/'},
 {q:'Che cosa sono le facies?',short:'Il significato dipende dal contesto: una facies sedimentaria descrive caratteri che aiutano a ricostruire l’ambiente di deposizione; una facies metamorfica raggruppa associazioni minerali legate a determinate condizioni di pressione e temperatura.',more:'In sedimentologia si considerano litologia, dimensione dei granuli, strutture e fossili: per esempio facies fluviali, lacustri o marine. Nel metamorfismo, esempi sono le facies degli scisti verdi, degli scisti blu, delle anfiboliti e delle eclogiti. Rocce di diversa composizione possono appartenere alla stessa facies metamorfica, pur mostrando minerali differenti.',avoid:'Chiedi se la domanda riguarda facies sedimentarie o metamorfiche. Una facies non è semplicemente un colore o una famiglia di rocce.',source:'https://www.treccani.it/enciclopedia/facies_(Dizionario-delle-Scienze-Fisiche)/'},
 {q:'Che cos’è un micascisto?',short:'È una roccia metamorfica scistosa ricca di miche visibili, la cui disposizione orientata dà alla roccia lucentezza e piani di scistosità.',more:'Contiene comunemente quarzo e miche come muscovite e biotite; può contenere granati o altri minerali, non obbligatori. Deriva spesso dal metamorfismo di sedimenti argillosi durante il metamorfismo regionale. Le miche sono in genere più riconoscibili che nella fillade; il gneiss presenta invece tipicamente bande composizionali.',avoid:'Non è composto solo da mica, non tutti i campioni contengono granati e la scistosità non coincide con la stratificazione sedimentaria.',rock:'micascisto',source:'https://www.treccani.it/enciclopedia/metamorfismo/'},
 {q:'Che cos’è una condotta freatica?',short:'È un condotto carsico che si sviluppa nella zona satura, sotto la superficie piezometrica locale, dove l’acqua riempie il passaggio e dissolve la roccia.',more:'Nelle rocce carbonatiche l’acqua con CO₂ favorisce la dissoluzione. L’allargamento può coinvolgere tutta la sezione del condotto, producendo spesso forme tubolari o ellittiche, condizionate anche da fratture e stratificazione. Se il livello dell’acqua scende, una vecchia condotta freatica può rimanere asciutta. Nella zona vadosa l’acqua scorre invece a superficie libera e può incidere soprattutto il fondo.',avoid:'“Freatica” indica le condizioni di formazione, non garantisce che la condotta sia tuttora allagata. Non è una tubazione artificiale. L’esplorazione speleologica richiede competenze e attrezzature specifiche.',source:'https://www.nps.gov/grba/planyourvisit/cave-geology-in-depth.htm'},
 {q:'Che cosa sono le ofioliti?',short:'Sono associazioni di rocce che testimoniano porzioni di antica litosfera oceanica, oggi conservate nelle catene montuose.',more:'Una successione oceanica idealizzata comprende peridotiti del mantello, gabbri, filoni basaltici, basalti anche a cuscino e sedimenti oceanici. Le successioni reali possono essere incomplete, deformate e metamorfiche: nelle Alpi troviamo serpentiniti, metagabbri e metabasalti. Le serpentiniti derivano dall’idratazione e trasformazione delle peridotiti. Il Monviso conserva importanti testimonianze dell’antico oceano della Tetide.',avoid:'Non sono un solo tipo di roccia e non sono tutte vulcaniche. Il colore verde da solo non dimostra un’origine ofiolitica.',source:'https://www.parcomonviso.eu/ambiente/la-geologia/il-monviso-e-le-pietre-verdi'}
];
function geaReview(){return `<section class="panel wide" id="gea-principali"><div class="eyebrow">DOMANDE PRINCIPALI · RIPASSO ORALE</div><h2 style="margin-top:10px">Le tue domande di geologia</h2><p>Argomenti segnalati da te come prioritari, non domande ufficiali garantite. Prova a rispondere a voce prima di aprire la risposta. “Diorite” e “anatessi” sono trattate come due domande separate.</p>${geaQuestions.map((q,i)=>`<details><summary>${i+1}. ${q.q}</summary><p><b>Risposta breve.</b> ${q.short}</p><p><b>Approfondimento.</b> ${q.more}</p><p class="notice"><b>Errore da evitare:</b> ${q.avoid}</p><div class="result-actions">${q.rock?`<button class="btn" data-action="detail" data-id="${q.rock}">Foto e scheda della roccia</button>`:''}<a class="btn" href="${q.source}" target="_blank" rel="noopener">Fonte di approfondimento ↗</a></div></details>`).join('')}<details><summary>7. Domanda aperta: descrivi i processi endogeni ed esogeni</summary><h3 style="margin-top:18px">Risposta modello per l’orale</h3><p>I processi geologici endogeni ed esogeni agiscono insieme nel modellare la Terra. Si distinguono soprattutto per la fonte di energia e per il contesto in cui operano.</p><p><b>I processi endogeni</b> sono legati all’energia interna della Terra e alla dinamica delle placche. Comprendono magmatismo e vulcanismo, deformazioni tettoniche come pieghe e faglie, sollevamento e formazione delle catene montuose, terremoti e metamorfismo. Creano e trasformano rocce e strutture; l’anatessi è un esempio di produzione di fuso a partire da rocce preesistenti.</p><p><b>I processi esogeni</b> agiscono alla superficie o vicino ad essa attraverso acqua, ghiaccio, vento, organismi e gravità. Il clima e il ciclo dell’acqua dipendono in larga misura dall’energia solare. Comprendono disgregazione fisica e alterazione chimica delle rocce, erosione, trasporto, sedimentazione e movimenti di versante. La gravità guida, per esempio, le frane; l’acqua può sciogliere i carbonati e creare forme carsiche anche nel sottosuolo.</p><p><b>I due gruppi sono collegati:</b> il sollevamento tettonico costruisce un rilievo, mentre agenti atmosferici, corsi d’acqua e ghiacciai lo modificano e redistribuiscono i materiali. Non è corretto dire che gli endogeni costruiscano sempre e gli esogeni distruggano sempre: la sedimentazione costruisce depositi, mentre la tettonica può anche abbassare porzioni della crosta.</p><p><b>Esempio locale:</b> l’orogenesi alpina ha creato e deformato le strutture e le rocce del territorio; molto più tardi il ghiacciaio della Val di Susa ha rimodellato il paesaggio di Avigliana, trasportando materiali e formando depositi morenici. Dopo il ritiro, i bacini hanno raccolto acqua e sedimenti. Le condotte freatiche sono invece un esempio di processo esogeno di dissoluzione carsica, non una forma da attribuire automaticamente al Lago Piccolo.</p><p class="notice"><b>Distinzione importante:</b> alterazione e disgregazione modificano la roccia in posto; erosione asporta materiale, trasporto lo sposta e sedimentazione lo deposita. La formazione di una roccia sedimentaria comprende poi la diagenesi.</p><h3>Scaletta da ricordare</h3><p>1. Fonte di energia → 2. processi ed esempi → 3. interazione → 4. esempio Avigliana.</p><a href="https://www.nps.gov/subjects/geology/geology-concepts.htm" target="_blank" rel="noopener">NPS: processi geologici ↗</a> · <a href="https://www.nps.gov/subjects/erosion/weathering.htm" target="_blank" rel="noopener">Alterazione delle rocce ↗</a></details><p class="help" style="margin-top:14px">Definizioni didattiche rielaborate da BGS, Treccani, NPS e Parco del Monviso. Consultazione: 13 ottobre 2026. Per le facies metamorfiche: <a href="https://www.treccani.it/enciclopedia/metamorfismo_(Enciclopedia-dei-ragazzi)/" target="_blank" rel="noopener">approfondimento Treccani ↗</a>.</p></section>`;}

function previewMarkup(s,selected=false){if(s.id==='lago-piccolo')return `<figure class="lake-photo"><img src="${mapAsset('lago-piccolo-foto.jpg')}" alt="Il Lago Piccolo di Avigliana"><figcaption>Marco Ebreo · CC BY-SA 4.0 · <a href="https://commons.wikimedia.org/wiki/File:Lago_Piccolo_Avigliana.jpg" target="_blank" rel="noopener">Foto originale ↗</a>. Ridimensionata per l’app.</figcaption></figure>`;const src=geoPreviews[s.id];if(!src)return '';return `<span class="geo-preview ${selected?'selected-preview':''}"><span class="preview-unavailable">${navigator.onLine?'Anteprima non disponibile':'Anteprima disponibile online'}</span>${navigator.onLine?`<img src="${esc(src)}" alt="Anteprima ufficiale: ${esc(s.name)}" loading="lazy" decoding="async" referrerpolicy="no-referrer">`:''}<span class="preview-credit">Anteprima · ARPA Piemonte</span></span>`;}
const geologicAssets={'lago-piccolo-foto.jpg':'./maps/lago-piccolo-foto.jpg','piemonte-geologico.jpg':'./maps/piemonte-geologico.jpg','avigliana-carg.jpg':'./maps/avigliana-carg.jpg','carg-legenda-depositi.jpg':'./maps/carg-legenda-depositi.jpg','carg-legenda-substrato.jpg':'./maps/carg-legenda-substrato.jpg'};
function mapAsset(file){return geologicAssets[file];}
function mapImage(file,alt){return `<img class="geologic-image" src="${mapAsset(file)}" alt="${esc(alt)}">`;}
function regionalLegendMarkup(){return `<details class="geologic-legend"><summary>Legenda GeoPiemonte: colori e unità geologiche (${geologicLegend.length} voci)</summary><p>Legenda originale del servizio GeoPiemonte 1:250.000. Ogni colore rappresenta un’unità, non necessariamente una sola roccia. Le sigle della carta CARG di Avigliana hanno una legenda diversa.</p><input type="search" id="geologic-legend-search" aria-label="Cerca nella legenda" placeholder="Cerca: granito, gneiss, serpentiniti, depositi…"><div id="geologic-legend-results" class="legend-results">${geologicLegend.map(legendRow).join('')}</div></details>`;}
function legendRow(l){return `<div class="legend-row"><img src="data:image/png;base64,${l.image}" alt=""><span><small>${esc(l.group)}</small>${esc(l.label)}</span></div>`;}
function filterGeologicLegend(text){const items=geologicLegend.filter(l=>normalized(l.label+' '+l.group).includes(normalized(text)));$('#geologic-legend-results').innerHTML=items.map(legendRow).join('')||'<p>Nessuna unità trovata.</p>';}
function aviglianaMapPanel(){return `<section class="panel wide geologic-panel"><div class="eyebrow">CARTA GEOLOGICA UFFICIALE · CARG 1:50.000</div><h2 style="margin-top:10px">Avigliana, Lago Grande e Lago Piccolo</h2><p>I colori e le sigle distinguono il substrato roccioso e i depositi superficiali. La carta mostra entrambi i laghi, la Sacra e l’anfiteatro morenico; non è una carta dei sentieri.</p><button class="map-image-button" data-action="geologic-zoom" data-id="avigliana">${mapImage('avigliana-carg.jpg','Carta geologica CARG: Avigliana, Lago Grande, Lago Piccolo e depositi morenici')}</button><div class="result-actions"><button class="btn primary" data-action="geologic-zoom" data-id="avigliana">⤢ Ingrandisci la carta</button><a class="btn" href="https://www.openaccessrepository.it/records/143629" target="_blank" rel="noopener">Foglio originale e legenda completa ↗</a></div><details class="geologic-legend"><summary>Legenda CARG: depositi superficiali</summary><p>Estratto della legenda originale del Foglio 155: usa le sigle stampate sulla carta. Ingrandisci per leggere i testi.</p><button class="map-image-button" data-action="geologic-zoom" data-id="depositi">${mapImage('carg-legenda-depositi.jpg','Legenda CARG: successione pliocenico-quaternaria e depositi superficiali')}</button></details><details class="geologic-legend"><summary>Legenda CARG: substrato e simboli</summary><button class="map-image-button" data-action="geologic-zoom" data-id="substrato">${mapImage('carg-legenda-substrato.jpg','Legenda CARG: substrato pre-pliocenico, unità oceaniche e continentali, simboli')}</button></details><p class="map-credit">Estratto del Foglio 155 “Torino Ovest”, Servizio Geologico d’Italia – ISPRA (2009), CNR, ARPA Piemonte e Università; CC BY 4.0. Carta visualizzata tramite il servizio ARPA Fogli CARG; legende ritagliate dal PDF originale. Riproduzione del 13 ottobre 2026, senza reinterpretazione dei colori.</p><p class="notice">Un ciottolo trasportato non identifica l’unità del terreno. Per leggere la carta confronta sempre posizione, sigla e legenda; ingrandire il disegno non aumenta la precisione del rilevamento.</p></section>`;}

const lakeSite={id:'lago-piccolo',name:'Lago Piccolo di Avigliana',town:'Avigliana',province:'TO',lat:45.05419,lon:7.39161,summary:'Bacino intermorenico: ghiacciaio, sedimenti e paesaggio. Il punto indica il lago, non un accesso né un affioramento.',url:'https://www.parchialpicozie.it/it/p/laghi-di-avigliana/'};
let regionalSearch='',regionalProvince='',selectedRegional='lago-piccolo';
function osmLink(s){return `https://www.openstreetmap.org/?mlat=${s.lat}&mlon=${s.lon}#map=14/${s.lat}/${s.lon}`;}
function regionalPoint(s){const R=6378137,x=R*s.lon*Math.PI/180,y=R*Math.log(Math.tan(Math.PI/4+s.lat*Math.PI/360));return {x:(x-715000)/325000*1300,y:(5870000-y)/410000*1640};}
function regionalMap(){const sites=[lakeSite,...regionalSites];return `<svg viewBox="0 0 1300 1640" class="regional-map geologic-regional-map" aria-label="Carta geologica GeoPiemonte con le posizioni dei geositi"><image href="${mapAsset('piemonte-geologico.jpg')}" x="0" y="0" width="1300" height="1640"/>${sites.map(s=>{const p=regionalPoint(s);return `<a href="#piemonte" data-action="regional-site" data-id="${s.id}" aria-label="${esc(s.name)}"><circle cx="${p.x}" cy="${p.y}" r="19" fill="transparent"/><circle cx="${p.x}" cy="${p.y}" r="${s.id===selectedRegional?13:7}" fill="${s.id===selectedRegional?'#bb6b41':'#193d35'}" stroke="#fff" stroke-width="3"/><title>${esc(s.name)} · ${esc(s.town)}</title></a>`;}).join('')}<text x="40" y="50" font-size="25" fill="#193d35">N ↑ · Punti di osservazione ARPA</text></svg>`;}
function regionalSelected(){const s=[lakeSite,...regionalSites].find(s=>s.id===selectedRegional)||lakeSite;return `<section class="panel wide regional-selected"><span class="eyebrow">PUNTO SELEZIONATO · ${esc(s.province)}</span><h2 style="margin-top:10px">${esc(s.name)}</h2>${previewMarkup(s,true)}<p>${esc(s.summary)}</p><p class="help">${esc(s.town)} · ${s.lat.toFixed(5)} N, ${s.lon.toFixed(5)} E. ${s.id==='lago-piccolo'?'Centro indicativo del bacino (Wikidata).':'Punto di osservazione del catasto ARPA, non necessariamente ingresso o parcheggio.'}</p><div class="result-actions"><a class="btn primary" href="${esc(s.url)}" target="_blank" rel="noopener">Scheda ufficiale e immagini ↗</a><a class="btn" href="${osmLink(s)}" target="_blank" rel="noopener">Apri posizione ↗</a><button class="btn" data-action="regional-online">Carica mappa stradale online</button>${s.id==='lago-piccolo'?'<button class="btn" data-view="avigliana">Approfondisci Lago Piccolo →</button>':''}</div><div id="regional-online-map"></div><p class="help" style="margin-top:12px">La mappa online contatta OpenStreetMap. Testi, coordinate e reticolo restano disponibili offline; le mappe stradali non vengono scaricate per l’uso offline.</p></section>`;}
function regionalList(){const terms=normalized(regionalSearch).split(/\s+/);return regionalSites.filter(s=>(!regionalProvince||s.province===regionalProvince)&&terms.every(t=>normalized(s.name+' '+s.town+' '+s.summary).includes(t)));}
function filterRegional(){const sites=regionalList();$('#regional-count').textContent=`${sites.length} geositi su ${regionalSites.length}`;$('#regional-list').innerHTML=sites.map(s=>`<button class="panel geo-card" data-action="regional-site" data-id="${s.id}">${previewMarkup(s)}<span class="pill">${esc(s.province)} · ${esc(s.town)}</span><h3>${esc(s.name)}</h3><p>${esc(s.summary)}</p><small>Vedi posizione e fonte →</small></button>`).join('')||'<p>Nessun risultato: prova un altro nome, comune o roccia.</p>';}
function piemonte(){return intro('GEOLOGIA DEL TERRITORIO','Piemonte.<br>Dalla roccia al paesaggio.','Esplora 53 geositi del catasto regionale ARPA e il focus sui Laghi di Avigliana.')+`<div class="result-actions" style="margin:0 0 24px"><button class="btn primary" data-view="avigliana">Avigliana e Lago Piccolo →</button><a class="btn" href="https://webgis.arpa.piemonte.it/geositi-piemonte/mappaPage" target="_blank" rel="noopener">Mappa completa ARPA ↗</a><a class="btn" href="https://www.arpa.piemonte.it/scheda-informativa/cartografia-geologica" target="_blank" rel="noopener">Carta delle unità geologiche ↗</a></div><div class="guide-grid"><section class="panel wide geologic-panel"><h2>Carta geologica del Piemonte</h2><p>Tocca un punto per aprire il geosito. I colori rappresentano unità geologiche del substrato e depositi superficiali, secondo la carta ufficiale GeoPiemonte 1:250.000.</p>${regionalMap()}<div class="result-actions"><button class="btn primary" data-action="geologic-zoom" data-id="piemonte">⤢ Ingrandisci la carta</button><a class="btn" href="${geoMapSource}" target="_blank" rel="noopener">Carta interattiva ufficiale: interroga le rocce ↗</a></div>${regionalLegendMarkup()}<p class="map-credit">Arpa Piemonte – Geoportale, CNR IGG. Servizio GeoPiemonte; licenza indicata nei metadati: CC BY 2.5 Italia. Estratto del 13 ottobre 2026; punti dei geositi sovrapposti dall’app in Web Mercator.</p></section>${regionalSelected()}<section class="panel wide"><h2>Tre chiavi per leggere il Piemonte</h2><p><b>Magmatiche:</b> intrusioni come granito di Montorfano, sienite della Valle Cervo e plutone di Traversella; in Valsesia anche strutture vulcaniche antiche.</p><p><b>Metamorfiche:</b> gneiss, micascisti, marmi e rocce di alta pressione; nelle ofioliti troviamo serpentiniti, metagabbri e metabasalti. Non tutte queste rocce sono comprese nelle 31 schede dell’atlante.</p><p><b>Sedimenti e forme:</b> sabbie, arenarie, carbonati, gessi e fossili del Bacino Terziario Piemontese; depositi glaciali, fluviali e lacustri nel Quaternario. Un deposito morenico non è una singola roccia.</p><p class="notice">Un geosito può essere una forma del paesaggio, non un affioramento. Non entrare in cave, miniere, grotte o proprietà private senza autorizzazione. Non raccogliere fossili o campioni nelle aree protette; verifica accessi, meteo e regolamenti presso il gestore.</p></section></div><div class="toolbar"><input id="regional-search" type="search" placeholder="Cerca roccia, comune, geosito…" aria-label="Cerca geositi" value="${esc(regionalSearch)}"><select id="regional-province" aria-label="Provincia"><option value="">Tutte le province</option>${[...new Set(regionalSites.map(s=>s.province))].sort().map(p=>`<option ${p===regionalProvince?'selected':''}>${p}</option>`).join('')}</select></div><p id="regional-count" class="count" aria-live="polite"></p><div id="regional-list" class="geo-grid"></div><p class="notice" style="margin-top:20px">Nomi, sintesi e coordinate: Arpa Piemonte – Geoportale, Catasto regionale dei geositi, CC BY 4.0; estrazione 13 ottobre 2026. È una selezione pubblicata dal servizio a questa data, non il censimento di tutti gli affioramenti piemontesi. Anteprime fotografiche caricate dal servizio ufficiale ARPA quando sei online; la scheda originale riporta le informazioni complete. Carte, legende, testi e coordinate sono inclusi anche offline.</p>`;}
function loadRegionalOnline(){const s=[lakeSite,...regionalSites].find(s=>s.id===selectedRegional)||lakeSite;const bbox=[s.lon-.035,s.lat-.022,s.lon+.035,s.lat+.022].join(',');$('#regional-online-map').innerHTML=navigator.onLine?`<iframe class="map-frame" title="Mappa OpenStreetMap di ${esc(s.name)}" src="https://www.openstreetmap.org/export/embed.html?bbox=${encodeURIComponent(bbox)}&layer=mapnik&marker=${s.lat}%2C${s.lon}" loading="lazy"></iframe><p class="help">© OpenStreetMap contributors · Se la mappa non appare, usa “Apri posizione”.</p>`:'<p class="notice">Sei offline. Usa coordinate e reticolo; la carta stradale richiede Internet.</p>';}
function avigliana(){return intro('FOCUS GEA · BASSA VAL DI SUSA','Avigliana.<br>Il Lago Piccolo racconta.','Geologia, acqua ed ecosistemi: una scheda di studio e osservazione, non un itinerario escursionistico.')+`<div class="result-actions" style="margin:0 0 24px"><button class="btn" data-view="piemonte">← Geositi del Piemonte</button><a class="btn primary" href="${osmLink(lakeSite)}" target="_blank" rel="noopener">Posizione del Lago Piccolo ↗</a><a class="btn" href="https://www.parchialpicozie.it/it/p/laghi-di-avigliana/" target="_blank" rel="noopener">Parco: informazioni e immagini ↗</a></div><div class="guide-grid">${aviglianaMapPanel()}<section class="panel wide"><h2>1. Un paesaggio modellato dal ghiacciaio</h2><p>Avigliana è all’uscita della Val di Susa, nell’anfiteatro morenico di Rivoli–Avigliana. Il ghiacciaio della Dora Riparia ha eroso, trasportato e deposto materiali; le successive fasi di ritiro hanno lasciato cordoni morenici e conche in cui si sono raccolte le acque.</p><p>La guida geologica dell’Ordine dei Geologi del Piemonte collega le morene che delimitano i due bacini alle fasi successive all’ultimo massimo glaciale (LGM). Le forme attuali non derivano da un unico istante: registrano più avanzate, ritiri ed evoluzioni successive.</p><p class="notice">“Origine glaciale” descrive la storia del bacino; “intermorenico” descrive la sua posizione tra i depositi. Il lago non è un cratere vulcanico.</p><a href="https://www.geologipiemonte.it/files/allegati/Guida_Anfiteatro_Rivoli.pdf" target="_blank" rel="noopener">Guida geologica Rivoli–Avigliana (PDF) ↗</a></section><section class="panel"><h2>2. Rocce o depositi?</h2><dl class="glossary"><dt>Substrato</dt><dd>Roccia consolidata che affiora o si trova sotto i sedimenti.</dd><dt>Deposito morenico</dt><dd>Miscela glaciale di blocchi, ciottoli e frazione fine. Non ha il nome di una singola roccia.</dd><dt>Masso erratico</dt><dd>Blocco trasportato dal ghiaccio: la sua composizione può differire dal substrato vicino.</dd><dt>Sedimento lacustre</dt><dd>Materiale che si accumula nel bacino, spesso fine e con resti biologici.</dd></dl><p>Non attribuire automaticamente a tutto il Lago Piccolo una litologia precisa. Per un affioramento servono posizione, carta geologica e osservazione; per un ciottolo occorre considerare il trasporto.</p></section><section class="panel"><h2>3. La Sacra come confronto</h2><p>Il Monte Pirchiriano, vicino ad Avigliana, offre un esempio distinto: la Sacra poggia su uno sperone di serpentinite. Nella costruzione si osservano anche metagabbri, calcescisti, marmi, gneiss e micascisti locali. Roccia in posto, pietra da costruzione e deposito glaciale vanno separati nel racconto.</p><button class="btn" data-action="regional-site" data-id="3522">Sacra: geosito e posizione →</button><p class="help">Fonte: catasto ARPA, Materiali lapidei della Sacra di San Michele.</p></section><section class="panel wide"><h2>4. Lago Piccolo: carta d’identità</h2><div class="lake-stats"><span><b>~60 ha</b>superficie</span><span><b>356 m</b>quota indicativa</span><span><b>~12 m</b>profondità massima</span><span><b>Intermorenico</b>contesto del bacino</span></div><p>Le quote e le superfici sono valori indicativi. Il Lago Piccolo è più alto del Lago Grande; l’acqua passa dal Piccolo al Grande attraverso il Rio Meana e prosegue verso la Palude dei Mareschi e la Dora Riparia attraverso la Naviglia. L’inquadramento idrografico non è una garanzia di percorribilità lungo gli emissari.</p><p class="help">Dati generali: Ente Parco e PiemonteOutdoor. Profondità: Treccani; il carotaggio LAVPICCO documenta 12 m d’acqua nel punto di campionamento.</p></section><section class="panel"><h2>5. Un archivio sotto l’acqua</h2><p>Il fondo conserva sedimenti utili a ricostruire il passato. Gli studi del Lago Piccolo hanno esaminato pollini e altri indicatori biologici, con cronologie basate anche sul radiocarbonio, per ricostruire vegetazione e cambiamenti ambientali.</p><p>Un polline racconta una pianta e il suo ambiente; una sequenza di strati racconta un’evoluzione. Non confondere queste indagini di laboratorio con la semplice osservazione di un ciottolo sulla riva.</p><a href="https://doi.pangaea.de/10.1594/PANGAEA.835847" target="_blank" rel="noopener">Dataset scientifico: profilo pollinico ↗</a><br><a href="https://doi.pangaea.de/10.1594/PANGAEA.838669" target="_blank" rel="noopener">Dataset: litologia del carotaggio ↗</a></section><section class="panel"><h2>6. Dal suolo agli ecosistemi</h2><p>Le rive alternano canneti, prati e boschi. A ovest del Lago Piccolo i versanti più umidi ospitano corsi d’acqua e boschi con castagno, carpino e frassino; presso Monte Capretto l’esposizione e le condizioni più asciutte favoriscono vegetazione xerotermica.</p><p>L’acqua, la pendenza, l’esposizione e il tipo di suolo aiutano a interpretare questa diversità: la geologia è una parte della spiegazione, non l’unico fattore.</p><a href="https://www.parchialpicozie.it/it/p/i-rilievi-collinari/" target="_blank" rel="noopener">Ente Parco: rilievi collinari ↗</a></section><section class="panel wide"><h2>7. Osservazioni sul campo</h2><ol><li><b>Leggi il rilievo:</b> riconosci conche e dorsali; non tutte le colline sono morene.</li><li><b>Guarda senza prelevare:</b> è roccia continua, un blocco isolato o materiale sciolto? Documenta nel taccuino con foto e GPS.</li><li><b>Confronta i caratteri:</b> cristalli, bande, granuli e alterazione. Mantieni “indeterminato” se gli indizi non bastano.</li><li><b>Collega acqua e habitat:</b> osserva ruscelli, canneti e versanti umidi restando sui percorsi consentiti.</li><li><b>Controlla la fonte:</b> verifica la posizione sulla carta geologica; non usare il punto al centro del lago come destinazione escursionistica.</li></ol><button class="btn" data-action="new-note">＋ Annota un’osservazione</button><p class="notice">Il Parco, nell’avviso del 26 febbraio 2026, segnala un’interruzione del lungolago e un’alternativa collinare. Non assumere che l’anello sia attualmente aperto: controlla avvisi e segnaletica prima della visita. Evita rive instabili, acqua e ghiaccio; non rompere affioramenti né disturbare fauna e vegetazione.</p><a href="https://www.parchialpicozie.it/it/news/2026/02/26/parco-naturale-laghi-di-avigliana-aggiornamento/" target="_blank" rel="noopener">Avviso ufficiale sul percorso ↗</a></section><section class="panel wide"><h2>8. Ripasso per l’esame GEA</h2><details><summary>Come distingui morena, substrato e masso erratico?</summary><p>La morena è un deposito glaciale eterogeneo; il substrato è roccia consolidata in posto; il masso erratico è un blocco trasportato dal ghiacciaio. La sola forma o tonalità non identifica la composizione.</p></details><details><summary>Perché un ciottolo non identifica la geologia della riva?</summary><p>Può provenire da lontano ed essere stato trasportato dal ghiaccio, dall’acqua o dall’uomo. La provenienza richiede contesto e confronti, non soltanto il nome della roccia.</p></details><details><summary>Qual è il valore scientifico dei sedimenti del Lago Piccolo?</summary><p>Sono un archivio stratificato. Pollini e altri resti biologici, insieme alle datazioni, permettono di ricostruire vegetazione e ambiente del passato.</p></details><details><summary>Come spiegheresti il lago a un gruppo?</summary><p>“Il ghiacciaio ha modellato questo paesaggio e ha lasciato depositi. Dopo il ritiro, l’acqua ha occupato la conca: il lago e le sue rive continuano a cambiare.” Poi separa ciò che vedi direttamente dalle interpretazioni tratte dalla carta.</p></details></section>${geaReview()}<section class="panel wide sources"><h2>Fonti e aggiornamento</h2><p>Consultazione: 13 ottobre 2026. Testi didattici rielaborati; non sostituiscono la carta geologica né gli avvisi del Parco.</p><ul><li><a href="https://www.parchialpicozie.it/it/p/laghi-di-avigliana/" target="_blank" rel="noopener">Aree Protette Alpi Cozie: Parco dei Laghi</a></li><li><a href="https://www.geologipiemonte.it/files/allegati/Guida_Anfiteatro_Rivoli.pdf" target="_blank" rel="noopener">Ordine dei Geologi del Piemonte: guida dell’anfiteatro</a></li><li><a href="https://www.treccani.it/enciclopedia/avigliana/" target="_blank" rel="noopener">Treccani: Avigliana</a></li><li><a href="https://doi.org/10.1002/jqs.971" target="_blank" rel="noopener">Finsinger e Tinner, 2006: vegetazione e uso del suolo</a></li><li><a href="https://www.wikidata.org/wiki/Q30132247" target="_blank" rel="noopener">Wikidata: coordinate indicative del lago</a></li></ul></section></div>`;}
